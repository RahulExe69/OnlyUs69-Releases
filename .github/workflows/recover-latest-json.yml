name: Recover legacy updater manifest

on:
  release:
    types: [deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-manifest-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Rebuild latest.json from newest remaining release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test manifest converter
        run: node --test scripts/test-build-latest-manifest.test.mjs

      - name: Select highest remaining stable version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only existing published Releases count. A deleted Release is no longer
          # in this list even if its underlying Git tag remains in the repository.
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name // empty' |
            grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V || true)"
          tag="$(printf '%s\n' "$tags" | tail -n 1)"
          if [ -z "$tag" ]; then
            echo "No stable releases remain."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Selected highest remaining stable release: $tag"

      - name: Remove stale manifest if no releases remain
        if: steps.latest.outputs.found != 'true'
        run: |
          set -euo pipefail
          if [ -f latest.json ]; then
            git rm latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove stale updater manifest after final release deletion"
            git push origin HEAD:main
          else
            echo "No latest.json to remove."
          fi

      - name: Fetch selected release information and metadata
        if: steps.latest.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${SELECTED_TAG}" > "$RUNNER_TEMP/github-release.json"
          mkdir -p "$RUNNER_TEMP/onlyus-metadata"
          gh release download "${SELECTED_TAG}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "onlyus-update-metadata.json" \
            --dir "$RUNNER_TEMP/onlyus-metadata"
          test -s "$RUNNER_TEMP/onlyus-metadata/onlyus-update-metadata.json"

      - name: Rebuild and validate latest.json
        if: steps.latest.outputs.found == 'true'
        env:
          METADATA_PATH: ${{ runner.temp }}/onlyus-metadata/onlyus-update-metadata.json
          RELEASE_INFO_PATH: ${{ runner.temp }}/github-release.json
          SELECTED_TAG: ${{ steps.latest.outputs.tag }}
          REPOSITORY_NAME: ${{ github.repository }}
          OUTPUT_PATH: latest.json
        run: node scripts/build-latest-manifest.mjs

      - name: Commit manifest if changed
        if: steps.latest.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json already matches the highest remaining stable release."
          else
            git commit -m "chore: recover latest.json for ${{ steps.latest.outputs.tag }}"
            git push origin HEAD:main
          fi
